<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- zones -->
  <rect x="24" y="32" width="248" height="444" rx="10" fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="40" y="56" font-size="15" fill="#5A6875" letter-spacing="1.5">INPUTS</text>
  <rect x="296" y="32" width="464" height="444" rx="10" fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="312" y="56" font-size="15" fill="#5A6875" letter-spacing="1.5">6D POSE, PIXIE REIMPLEMENTED</text>
  <rect x="784" y="32" width="392" height="444" rx="10" fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="800" y="56" font-size="15" fill="#5A6875" letter-spacing="1.5">ASSEMBLY CHECK, ADDED HERE</text>

  <!-- INPUTS -->
  <rect x="40" y="76" width="216" height="162" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <image href="ov_photo.jpg" x="41" y="77" width="214" height="160"/>
  <text x="40" y="264" font-size="18" fill="#15202A">RGB photo + <tspan font-family="Georgia, serif" font-style="italic">K</tspan></text>
  <rect x="40" y="296" width="216" height="80" rx="10" fill="#FBE5CF" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="56" y="328" font-size="22" fill="#15202A">CAD model</text>
  <text x="56" y="354" font-size="16" fill="#5A6875">untextured, as designed</text>
  <text x="40" y="420" font-size="16" fill="#5A6875">PIXIE dataset: 695 photos,</text>
  <text x="40" y="441" font-size="16" fill="#5A6875">48 scenes, 4 LEGO models</text>

  <!-- POSE: top row -->
  <line x1="256" y1="130" x2="308" y2="130" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="312" y="92" width="124" height="76" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <text x="374" y="124" font-size="22" fill="#15202A" text-anchor="middle">Work area</text>
  <text x="374" y="150" font-size="16" fill="#5A6875" text-anchor="middle">ArUco board</text>
  <line x1="436" y1="130" x2="452" y2="130" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="456" y="92" width="156" height="76" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="534" y="124" font-size="22" fill="#15202A" text-anchor="middle">Coarse pose</text>
  <text x="534" y="150" font-size="16" fill="#5A6875" text-anchor="middle">whole area</text>
  <line x1="612" y1="130" x2="628" y2="130" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="632" y="92" width="112" height="76" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="2"/>
  <text x="688" y="124" font-size="22" fill="#15202A" text-anchor="middle">Pose</text>
  <text x="688" y="150" font-size="16" fill="#5A6875" text-anchor="middle"><tspan font-family="Georgia, serif" font-style="italic">R, t</tspan> in crop</text>

  <!-- reference set -->
  <rect x="456" y="240" width="288" height="80" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <text x="600" y="272" font-size="22" fill="#15202A" text-anchor="middle">Reference renders</text>
  <text x="600" y="298" font-size="16" fill="#5A6875" text-anchor="middle">121 views x 8 rolls, normal + depth</text>
  <line x1="256" y1="336" x2="424" y2="336" stroke="#444" stroke-width="2"/>
  <path d="M424,336 L424,280 L452,280" fill="none" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="534" y1="240" x2="534" y2="172" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="688" y1="240" x2="688" y2="172" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="546" y="212" font-size="16" fill="#5A6875">2D-3D matches</text>
  <text x="456" y="346" font-size="16" fill="#5A6875">SuperPoint + LightGlue, RANSAC PnP</text>

  <!-- pose result -->
  <text x="312" y="388" font-size="16" fill="#15202A">Median ADD, no ground truth at inference</text>
  <text x="312" y="422" font-size="26" font-weight="bold" fill="#B8461F">0.32 cm</text>
  <text x="430" y="422" font-size="18" fill="#5A6875">paper 0.36 cm</text>
  <text x="312" y="452" font-size="16" fill="#5A6875">88.6 % of photos under 1 cm (paper 73.5 %)</text>

  <!-- POSE -> CHECK -->
  <line x1="744" y1="114" x2="820" y2="114" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>

  <!-- CHECK -->
  <rect x="824" y="76" width="336" height="76" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="2"/>
  <text x="992" y="108" font-size="22" fill="#15202A" text-anchor="middle">CAD edges vs photo</text>
  <text x="992" y="134" font-size="16" fill="#5A6875" text-anchor="middle">scored per part, image, scene</text>
  <rect x="824" y="172" width="216" height="162" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <image href="ov_check.jpg" x="825" y="173" width="214" height="160"/>
  <text x="1056" y="196" font-size="16" fill="#0D7A6F">green:</text>
  <text x="1056" y="216" font-size="16" fill="#5A6875">edge seen</text>
  <text x="1056" y="248" font-size="16" fill="#C0392B">red:</text>
  <text x="1056" y="268" font-size="16" fill="#5A6875">not seen</text>
  <text x="1056" y="300" font-size="16" fill="#5A6875">here, 2 bricks</text>
  <text x="1056" y="320" font-size="16" fill="#5A6875">are missing</text>

  <text x="824" y="388" font-size="16" fill="#15202A">Defective vs correct scenes (25 / 23)</text>
  <text x="824" y="422" font-size="26" font-weight="bold" fill="#B8461F">0.920 AUROC</text>
  <text x="824" y="452" font-size="16" fill="#5A6875">tuned on synthetic defects only</text>
</svg>
